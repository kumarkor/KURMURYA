<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माझा भारी AI चॅटबॉट</title>
    <!-- सुंदर डिझाईनसाठी Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 text-center shadow-md">
        <h1 class="text-xl font-bold text-cyan-400">⚡ Gemini AI मराठी असिस्टंट</h1>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-700 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">
                नमस्कार भावा! मी तुझा AI मित्र तयार आहे. आज काय गप्पा मारूया?
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="bg-slate-800 p-4 shadow-lg">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="इथे काहीतरी मेसेज टाईप कर..." class="flex-1 bg-slate-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <button onclick="sendMessage()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition">पाठव</button>
        </div>
    </div>

    <!-- JavaScript लॉजिक -->
    <script>
        const apiKey = "AQ.Ab8RN6LiFoi8T2OlHnTS_18XSxXB53B2MQrGaopPoy8MQ7sQog";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const message = inputField.value.trim();

            if (!message) return;

            // युजरचा मेसेज स्क्रीनवर दाखवूया
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-cyan-600 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">${message}</div>
                </div>`;
            
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // लोडिंग मेसेज
            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-700 text-slate-400 p-3 rounded-2xl">विचार करत आहे...</div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // गुगलच्या नवीन 3.5-flash-lite मॉडेलला थेट रिक्वेस्ट पाठवूया
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "systemInstruction": {
                            "parts": [{ "text": "तू माझा एक खूप जवळचा, हुशार आणि मजेशीर AI मित्र आहेस. माझ्या प्रत्येक प्रश्नाचे उत्तर एकदम भारी, मैत्रीपूर्ण आणि मराठी भाषेत Emojis वापरून दे." }]
                        },
                        "contents": [{ "parts": [{ "text": message }] }]
                    })
                });

                let data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let botReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `
                        <div class="flex justify-start">
                            <div class="bg-slate-700 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">${botReply}</div>
                        </div>`;
                } else {
                    throw new Error("डेटा मिळाला नाही");
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-500 text-white p-3 rounded-2xl">काहीतरी तांत्रिक अडचण आली भावा!</div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
