<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Game</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#1e293b;
padding:30px;
border-radius:20px;
text-align:center;
width:340px;
color:#fff;
box-shadow:0 0 20px #000;
}

h1{
margin-bottom:20px;
}

.dice{
font-size:90px;
margin:20px 0;
transition:.2s;
}

.result{
font-size:30px;
font-weight:bold;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.roll{
background:#22c55e;
color:#fff;
}

.reset{
background:#ef4444;
color:#fff;
}

.stats{
margin-top:20px;
font-size:18px;
line-height:32px;
}
</style>

</head>
<body>

<div class="container">

<h1>🎲 Dice Game</h1>

<div class="dice" id="dice">🎲</div>

<div class="result" id="number">0</div>

<button class="roll" onclick="rollDice()">
🎲 Roll Dice
</button>

<button class="reset" onclick="resetGame()">
🔄 Reset
</button>

<div class="stats">
<div>📊 Roll Count : <span id="count">0</span></div>
<div>⭐ Best Roll : <span id="best">0</span></div>
</div>

</div>

<script>

const diceEmoji=[
"",
"⚀",
"⚁",
"⚂",
"⚃",
"⚄",
"⚅"
];

let count=0;
let best=0;

function rollDice(){

let num=Math.floor(Math.random()*6)+1;

document.getElementById("number").innerHTML=num;
document.getElementById("dice").innerHTML=diceEmoji[num];

count++;
document.getElementById("count").innerHTML=count;

if(num>best){
best=num;
document.getElementById("best").innerHTML=best;
}

}

function resetGame(){

count=0;
best=0;

document.getElementById("number").innerHTML=0;
document.getElementById("dice").innerHTML="🎲";

document.getElementById("count").innerHTML=0;
document.getElementById("best").innerHTML=0;

}

</script>

</body>
</html>
