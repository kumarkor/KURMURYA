<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माझा भारी AI चॅटबॉट</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md flex justify-between items-center px-6">
        <h1 class="text-xl font-bold text-cyan-400">⚡ Gemini AI मराठी असिस्टंट</h1>
        <button onclick="openSettings()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg text-cyan-300 transition">⚙️ API Key सेट करा</button>
    </header>

    <!-- API Key Modal / Setup Box -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 flex justify-center items-center p-4 z-50">
        gemini-3.5-flash-lite
        <div class="bg-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 border border-slate-700 shadow-2xl">
            <h3 class="text-lg font-bold text-cyan-400">तुमची Gemini API Key टाка</h3>
            <p class="text-xs text-slate-400">ही Key फक्त तुमच्या ब्राउझरमध्ये सेव्ह राहील, GitHub वर लीक होणार नाही.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-900 text-white px-4 py-3 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-400">
            <div class="flex justify-end gap-2">
                <button onclick="saveApiKey()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-5 py-2 rounded-xl transition">सेव्ह करा</button>
            </div>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <div class="flex justify-start">
            <div class="bg-slate-700 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">
                नमस्कार भावा! आपली वेबसाईट एकदम सुरक्षित आणि तयार आहे. वरच्या सेटिंग बटणवर जाऊन तुझी नवीन API Key टाक आणि बोलायला सुरुवात कर! 🚀
            </div>
        </div>
    </div>

    <!-- Input Box -->
    <div class="bg-slate-800 p-4 shadow-lg">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="user-input" placeholder="काहीतरी मेसेज टाईप कर..." class="flex-1 bg-slate-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-400" onkeypress="checkEnter(event)">
            <button onclick="sendMessage()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition">पाठव</button>
        </div>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Fokyta-OqM1xQKmsoFyMsJcAfsJtftw",
            authDomain: "coming-886f7.firebaseapp.com",
            databaseURL: "https://coming-886f7-default-rtdb.firebaseio.com",
            projectId: "coming-886f7",
            storageBucket: "coming-886f7.firebasestorage.app",
            messagingSenderId: "750181985724",
            appId: "1:750181985724:web:9ea95bd47645e54d774fb9",
            measurementId: "G-CXY55VR2WV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatContainer = document.getElementById("chat-container");
        const chatRef = ref(db, 'chats/');

        // लोकल स्टोरेजमधून API Key तपासणे
        window.openSettings = function() {
            document.getElementById("settings-modal").classList.remove("hidden");
        }

        window.saveApiKey = function() {
            let key = document.getElementById("api-key-input").value.trim();
            if(key) {
                localStorage.setItem("gemini_user_key", key);
                document.getElementById("settings-modal").classList.add("hidden");
                alert("API Key यशस्वीरीत्या सेव्ह झाली!");
            } else {
                alert("कृपया योग्य Key टाका.");
            }
        }

        // पेज लोड झाल्यावर जर Key नसेल तर बॉक्स उघडणे
        window.onload = function() {
            if(!localStorage.getItem("gemini_user_key")) {
                openSettings();
            }
        }

        // Firebase मधून जुने मेसेज लोड करणे
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            appendMessage(data.sender, data.text);
        });

        window.sendMessage = async function() {
            let geminiApiKey = localStorage.getItem("gemini_user_key");
            if (!geminiApiKey) {
                alert("पहिले '⚙️ API Key सेट करा' वर क्लिक करून तुमची Key टाका!");
                openSettings();
                return;
            }

            const inputField = document.getElementById("user-input");
            const message = inputField.value.trim();
            if (!message) return;

            inputField.value = "";
            push(chatRef, { sender: 'user', text: message });

            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-700 text-slate-400 p-3 rounded-2xl">विचार करत आहे...</div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${geminiApiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "systemInstruction": {
                            "parts": [{ "text": "तू माझा एक खूप जवळचा, हुशार आणि मजेशीर AI मित्र आहेस. मराठीत मैत्रीपूर्ण भाषेत Emojis वापरून उत्तरे दे." }]
                        },
                        "contents": [{
                            "role": "user",
                            "parts": [{ "text": message }]
                        }]
                    })
                });

                let data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let botReply = data.candidates[0].content.parts[0].text;
                    push(chatRef, { sender: 'bot', text: botReply });
                } else if (data.error) {
                    appendMessage('bot', 'गुगल एरर: ' + data.error.message);
                } else {
                    throw new Error("डेटा मिळाला नाही");
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('bot', 'काहीतरी तांत्रिक अडचण आली भावा!');
            }
        }

        window.checkEnter = function(event) {
            if (event.key === "Enter") { sendMessage(); }
        }

        function appendMessage(sender, text) {
            if (sender === 'user') {
                chatContainer.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-cyan-600 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">${text}</div>
                    </div>`;
            } else {
                chatContainer.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-slate-700 text-white p-3 rounded-2xl max-w-xs md:max-w-md shadow">${text}</div>
                    </div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
